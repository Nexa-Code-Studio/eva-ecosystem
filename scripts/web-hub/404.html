<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>EVA AI — Routing Redirect</title>
  <script>
    // Smart SPA Router Redirect for GitHub Pages
    (function() {
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      // Detect repo subpath or custom domain root
      var appIdx = path.indexOf('/app');
      var counselorIdx = path.indexOf('/counselor');

      if (appIdx !== -1) {
        var basePath = path.substring(0, appIdx + 4);
        window.location.replace(basePath + '/' + (hash || search || ''));
        return;
      } else if (counselorIdx !== -1) {
        var basePath = path.substring(0, counselorIdx + 10);
        window.location.replace(basePath + '/' + (hash || search || ''));
        return;
      }

      // Default fallback: Go to root of the pages site
      var repoMatch = path.match(/^\/([^\/]+)/);
      var rootUrl = repoMatch ? '/' + repoMatch[1] + '/' : '/';
      window.location.replace(rootUrl);
    })();
  </script>
</head>
<body style="background:#0b0f19; color:#94a3b8; font-family:system-ui, sans-serif; text-align:center; padding-top:25vh;">
  <h2 style="color:#ffffff; margin-bottom:0.5rem;">EVA AI Ecosystem</h2>
  <p>Mengarahkan ke aplikasi...</p>
</body>
</html>
