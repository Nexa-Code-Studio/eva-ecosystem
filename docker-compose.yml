
services:
  api:
    build:
      context: .
      dockerfile: apps/backend/api/Dockerfile
    container_name: eva_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8888 --reload
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace
      - eva_uploads:/app/uploads
    env_file:
      - .env
    environment:
      - PYTHONPATH=/workspace
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@eva_postgres:5432/eva_ai?ssl=disable
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - MIDTRANS_IS_PRODUCTION=${MIDTRANS_IS_PRODUCTION:-false}
      - MIDTRANS_SANDBOX_SIMULATION_ENABLED=${MIDTRANS_SANDBOX_SIMULATION_ENABLED:-true}
      - EMOTION_STREAMING_ENABLED=${EMOTION_STREAMING_ENABLED:-true}
      - EMOTION_PROVIDER=${EMOTION_PROVIDER:-remote_http}
      - EMOTION_SERVICE_URL=${EMOTION_SERVICE_URL:-http://emotion_service:8890}
      - EMOTION_SERVICE_AUTH_MODE=${EMOTION_SERVICE_AUTH_MODE:-none}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      emotion_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - eva_network

  mcp:
    build:
      context: .
      dockerfile: apps/backend/mcp/Dockerfile
    container_name: eva_mcp
    command: python -m app.main
    ports:
      - "8889:8889"
    volumes:
      - .:/workspace
    env_file:
      - .env
    environment:
      - PYTHONPATH=/workspace
      - APP_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - redis
      - qdrant
    networks:
      - eva_network

  worker:
    build:
      context: .
      dockerfile: apps/backend/workers/Dockerfile
    container_name: eva_worker
    command: arq app.workers.settings.WorkerSettings
    volumes:
      - .:/workspace
    env_file:
      - .env
    environment:
      - PYTHONPATH=/workspace
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@eva_postgres:5432/eva_ai?ssl=disable
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - MIDTRANS_IS_PRODUCTION=${MIDTRANS_IS_PRODUCTION:-false}
      - MIDTRANS_SANDBOX_SIMULATION_ENABLED=${MIDTRANS_SANDBOX_SIMULATION_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - eva_network

  postgres:
    image: postgres:16-alpine
    container_name: eva_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=eva_ai
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eva_ai"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eva_network

  redis:
    image: redis:7-alpine
    container_name: eva_redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eva_network

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: eva_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - eva_network

  emotion_service:
    build:
      context: .
      dockerfile: apps/backend/emotion_service/Dockerfile.dev
    container_name: eva_emotion_service
    ports:
      - "8890:8890"
    volumes:
      - emotion_models:/models
      - emotion_model_cache:/home/appuser/.cache
    environment:
      - APP_ENV=development
      - PORT=8890
      - EMOTION_ENGINE_BACKEND=${EMOTION_ENGINE_BACKEND:-auto}
      - EMOTION_FUNASR_MODEL=${EMOTION_FUNASR_MODEL:-iic/emotion2vec_plus_base}
      - EMOTION_SERVICE_AUTH_MODE=${EMOTION_SERVICE_AUTH_MODE:-none}
      - ORT_INTRA_OP_THREADS=2
      - ORT_INTER_OP_THREADS=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8890/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - eva_network

networks:
  eva_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  eva_uploads:
  emotion_models:
  emotion_model_cache:
