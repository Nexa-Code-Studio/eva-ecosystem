[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eva-emotion-service"
version = "0.1.0"
description = "Isolated stateless ONNX Runtime INT8 speech emotion inference microservice (Cloud Run target)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "numpy>=1.26.0,<3.0.0",
    "onnxruntime>=1.18.0,<2.0.0",
]

[project.optional-dependencies]
gcp = [
    "google-auth>=2.29.0,<3.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
