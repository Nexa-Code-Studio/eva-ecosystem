name: eva_counselor_mobile
description: "EVA Counselor & Psychologist Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  flutter_webrtc: ^1.6.3
  permission_handler: ^13.0.2
  wakelock_plus: ^1.8.2
  web_socket_channel: ^3.0.3

  webrtc_client:
    path: ../../packages/webrtc_client
  google_sign_in: ^6.2.2
  file_picker: ^13.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/eva_logo.png
    - assets/images/eva_logo_square.png
