name: Build Backend & Deploy to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - 'packages/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-backend-vps.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: 'backend-vps-deploy'
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Private Docker Images to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository owner to lowercase
        id: repo_owner
        run: |
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build & Push eva-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/eva-api:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/eva-api:${{ github.sha }}

      - name: Build & Push eva-worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/workers/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/eva-worker:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/eva-worker:${{ github.sha }}

      - name: Build & Push eva-mcp
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/mcp/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/eva-mcp:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/eva-mcp:${{ github.sha }}

  deploy-to-vps:
    name: Trigger VPS Deployment Runbook
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            echo "==> Authenticating Docker to GHCR on VPS..."
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            echo "==> Triggering deployment runbook..."
            /root/vps-blueprints/runbooks/deploy-eva-backend.sh

      - name: Notify Discord on VPS Backend Deploy Success
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured. Skipping Discord notification."
            exit 0
          fi
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          ACTOR="${{ github.actor }}"

          PAYLOAD=$(cat <<EOF
          {
            "embeds": [
              {
                "title": "🖥️ Deployment Berhasil: Backend API VPS",
                "description": "Container Docker backend API (\`eva-api\`, \`eva-worker\`, \`eva-mcp\`) berhasil diperbarui dan berjalan sehat di VPS!\n\n🩺 **Healthcheck**: HTTP 200 OK",
                "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "color": 3066993,
                "fields": [
                  {"name": "Branch", "value": "\`main\`", "inline": true},
                  {"name": "Commit", "value": "\`${SHORT_SHA}\`", "inline": true},
                  {"name": "Host", "value": "172.93.219.133", "inline": true}
                ],
                "footer": {"text": "EVA AI VPS CD Pipeline • GitHub Actions"},
                "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              }
            ],
            "allowed_mentions": {"parse": []}
          }
          EOF
          )

          curl -s -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
