name: Deploy Eva Mobile Web to Vercel

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend API Base URL (HTTPS required)'
        required: true
        default: 'https://eva.nexacode.dev/api/v1'
      use_hybrid:
        description: 'Enable Hybrid Fallback (Auto-mock on API failure/offline)'
        required: true
        type: boolean
        default: true
      is_production:
        description: 'Deploy to Production (true) or Preview (false)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: 'vercel-deploy'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/eva_mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Flutter Web (Hybrid Mode)
        run: |
          API_URL="${{ github.event.inputs.api_base_url || 'https://eva.nexacode.dev/api/v1' }}"
          USE_HYBRID="${{ github.event.inputs.use_hybrid != 'false' && 'true' || 'false' }}"

          echo "========================================================"
          echo "Building Eva Mobile Web for Vercel (Hybrid Mode):"
          echo "  - API Base URL   : $API_URL"
          echo "  - Hybrid Fallback: $USE_HYBRID"
          echo "  - Base Href      : /"
          echo "========================================================"

          flutter build web --release \
            --base-href "/" \
            --dart-define=USE_LOCAL_API=false \
            --dart-define=USE_HYBRID_FALLBACK="$USE_HYBRID" \
            --dart-define=HYBRID="$USE_HYBRID" \
            --dart-define=API_BASE_URL="$API_URL"

      - name: Copy vercel.json into build/web
        run: |
          cp web/vercel.json build/web/vercel.json

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: apps/eva_mobile/build/web
          vercel-args: ${{ github.event.inputs.is_production != 'false' && '--prod' || '' }}
