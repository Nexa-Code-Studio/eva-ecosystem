name: Deploy EVA Ecosystem Web (Mobile & Counselor) to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend API Base URL (HTTPS required)'
        required: true
        default: 'https://eva.nexacode.dev/api/v1'
      use_hybrid:
        description: 'Enable Hybrid Fallback for Eva Mobile'
        required: true
        type: boolean
        default: true
      base_href:
        description: 'Custom base href (Leave empty or "/" for auto repo name detection)'
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - 'apps/eva_mobile/**'
      - 'apps/eva_counselor_mobile/**'
      - 'scripts/web-hub/**'
      - '.github/workflows/deploy-mobile-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Resolve Environment & Base Href
        id: env_setup
        run: |
          API_URL="${{ github.event.inputs.api_base_url || 'https://eva.nexacode.dev/api/v1' }}"
          USE_HYBRID="${{ github.event.inputs.use_hybrid != 'false' && 'true' || 'false' }}"
          INPUT_BASE="${{ github.event.inputs.base_href }}"
          REPO_NAME="${{ github.event.repository.name }}"

          if [ -n "$INPUT_BASE" ] && [ "$INPUT_BASE" != "auto" ]; then
            BASE_HREF="$INPUT_BASE"
          elif [ -n "$REPO_NAME" ]; then
            BASE_HREF="/${REPO_NAME}/"
          else
            BASE_HREF="/"
          fi

          # Ensure BASE_HREF ends with /
          [[ "$BASE_HREF" != */ ]] && BASE_HREF="${BASE_HREF}/"

          echo "BASE_HREF=${BASE_HREF}" >> $GITHUB_ENV
          echo "API_URL=${API_URL}" >> $GITHUB_ENV
          echo "USE_HYBRID=${USE_HYBRID}" >> $GITHUB_ENV

          echo "========================================================"
          echo "Build Matrix Configuration:"
          echo "  - Root Base Href  : $BASE_HREF"
          echo "  - Eva Mobile Href : ${BASE_HREF}app/"
          echo "  - Counselor Href  : ${BASE_HREF}counselor/"
          echo "  - Backend API URL : $API_URL"
          echo "  - Hybrid Fallback : $USE_HYBRID"
          echo "========================================================"

      - name: Build 1/2: Eva Mobile (Flutter Web Hybrid)
        run: |
          echo "==> Building Eva Mobile Web for ${BASE_HREF}app/ ..."
          cd apps/eva_mobile
          flutter pub get
          flutter build web --release \
            --base-href "${BASE_HREF}app/" \
            --dart-define=USE_LOCAL_API=false \
            --dart-define=USE_HYBRID_FALLBACK="${USE_HYBRID}" \
            --dart-define=HYBRID="${USE_HYBRID}" \
            --dart-define=API_BASE_URL="${API_URL}"

      - name: Build 2/2: Eva Counselor (Flutter Web Cloud)
        run: |
          echo "==> Building Eva Counselor Web for ${BASE_HREF}counselor/ ..."
          cd apps/eva_counselor_mobile
          flutter pub get
          flutter build web --release \
            --base-href "${BASE_HREF}counselor/" \
            --dart-define=USE_LOCAL_API=false \
            --dart-define=USE_MOCK_DATA=false

      - name: Assemble GitHub Pages Multi-App Distribution
        run: |
          echo "==> Assembling final distribution bundle in dist/ ..."
          rm -rf dist
          mkdir -p dist/app dist/counselor

          # Copy compiled apps into their subdirectories
          cp -r apps/eva_mobile/build/web/* dist/app/
          cp -r apps/eva_counselor_mobile/build/web/* dist/counselor/

          # Copy Portal Hub & Smart SPA 404 handler
          cp scripts/web-hub/index.html dist/index.html
          cp scripts/web-hub/404.html dist/404.html

          # Disable Jekyll engine for full asset support
          touch dist/.nojekyll

          echo "Distribution bundle contents:"
          ls -la dist/
          echo "dist/app contents:"
          ls -la dist/app/ | head -n 10
          echo "dist/counselor contents:"
          ls -la dist/counselor/ | head -n 10

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
