name: Build & Release Mobile & Web

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Target Application'
        required: true
        default: 'eva_counselor_mobile'
        type: choice
        options:
          - 'eva_counselor_mobile'
          - 'eva_mobile'
          - 'all'
      target:
        description: 'Target platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'android'
          - 'web'
          - 'ios'
      build_type:
        description: 'Build configuration'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'debug'
      create_release:
        description: 'Publish release assets to GitHub Releases'
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'apps/eva_mobile/**'
      - 'apps/eva_counselor_mobile/**'
      - 'packages/webrtc_client/**'
      - '.github/workflows/build-mobile.yml'
    tags:
      - 'build-*'
      - 'v*'
      - 'release-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'android' || github.event.inputs.target == null }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Build APK - Eva Counselor Mobile (Psikolog)
        if: ${{ github.event.inputs.app == 'eva_counselor_mobile' || github.event.inputs.app == 'all' || (github.event.inputs.app == null && startsWith(github.ref, 'refs/tags/')) }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          echo "Building Eva Counselor Mobile Android APK (${BUILD_TYPE})..."
          cd apps/eva_counselor_mobile
          flutter pub get
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug --android-skip-build-dependency-validation \
              --dart-define=USE_LOCAL_API=false \
              --dart-define=USE_HYBRID_FALLBACK=true \
              --dart-define=HYBRID=true \
              --dart-define=API_BASE_URL=https://eva.nexacode.dev/api/v1
            cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/eva-counselor-mobile-debug.apk"
          else
            flutter build apk --release --android-skip-build-dependency-validation \
              --dart-define=USE_LOCAL_API=false \
              --dart-define=USE_HYBRID_FALLBACK=true \
              --dart-define=HYBRID=true \
              --dart-define=API_BASE_URL=https://eva.nexacode.dev/api/v1
            cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/eva-counselor-mobile-release.apk"
          fi

      - name: Build APK - Eva Mobile (Gen Z Curhat)
        if: ${{ github.event.inputs.app == 'eva_mobile' || github.event.inputs.app == 'all' || github.ref == 'refs/heads/main' || (github.event.inputs.app == null && !contains(github.ref, 'eva_counselor_mobile')) }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          echo "Building Eva Mobile Android APK (${BUILD_TYPE})..."
          cd apps/eva_mobile
          flutter pub get
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug --android-skip-build-dependency-validation \
              --dart-define=USE_LOCAL_API=false \
              --dart-define=USE_HYBRID_FALLBACK=true \
              --dart-define=HYBRID=true \
              --dart-define=API_BASE_URL=https://eva.nexacode.dev/api/v1
            cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/eva-mobile-debug.apk"
          else
            flutter build apk --release --android-skip-build-dependency-validation \
              --dart-define=USE_LOCAL_API=false \
              --dart-define=USE_HYBRID_FALLBACK=true \
              --dart-define=HYBRID=true \
              --dart-define=API_BASE_URL=https://eva.nexacode.dev/api/v1
            cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/eva-mobile-release.apk"
          fi

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: "*.apk"
          if-no-files-found: error
          retention-days: 14

  build-web:
    name: Build Web Packages
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event.inputs.target == 'all' || github.event.inputs.target == 'web' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Web - Eva Counselor Mobile
        if: ${{ github.event.inputs.app == 'eva_counselor_mobile' || github.event.inputs.app == 'all' || github.event.inputs.app == null }}
        run: |
          echo "Building Eva Counselor Web Release..."
          cd apps/eva_counselor_mobile
          flutter pub get
          flutter build web --release \
            --dart-define=USE_LOCAL_API=false \
            --dart-define=USE_HYBRID_FALLBACK=true \
            --dart-define=HYBRID=true \
            --dart-define=API_BASE_URL=https://eva.nexacode.dev/api/v1
          cd build
          tar -czf "$GITHUB_WORKSPACE/eva-counselor-web.tar.gz" web/
          zip -r -q "$GITHUB_WORKSPACE/eva-counselor-web.zip" web/

      - name: Build Web - Eva Mobile
        if: ${{ github.event.inputs.app == 'eva_mobile' || github.event.inputs.app == 'all' }}
        run: |
          echo "Building Eva Mobile Web Release..."
          cd apps/eva_mobile
          flutter pub get
          flutter build web --release \
            --dart-define=USE_LOCAL_API=false \
            --dart-define=USE_HYBRID_FALLBACK=true \
            --dart-define=HYBRID=true \
            --dart-define=API_BASE_URL=https://eva.nexacode.dev/api/v1
          cd build
          tar -czf "$GITHUB_WORKSPACE/eva-mobile-web.tar.gz" web/
          zip -r -q "$GITHUB_WORKSPACE/eva-mobile-web.zip" web/

      - name: Upload Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-packages
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iPhone iOS (.ipa Package)
    runs-on: macos-latest
    if: ${{ github.event.inputs.target == 'ios' }}
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Xcode Environment
        run: flutter doctor -v

      - name: Build iPhone App & Package (.ipa) - Eva Counselor
        if: ${{ github.event.inputs.app == 'eva_counselor_mobile' || github.event.inputs.app == 'all' || github.event.inputs.app == null }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          cd apps/eva_counselor_mobile
          flutter pub get
          flutter build ios --no-codesign
          BUILD_DIR="build/ios/iphoneos"
          IPA_NAME="EvaCounselor-iPhone-${BUILD_TYPE}-unsigned.ipa"
          cd "$BUILD_DIR"
          mkdir -p Payload && cp -r Runner.app Payload/ && zip -r "${IPA_NAME}" Payload && rm -rf Payload
          cp "${IPA_NAME}" "$GITHUB_WORKSPACE/"

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: "*.ipa"
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android]
    if: always() && (needs.build-android.result == 'success') && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event.inputs.create_release == true || github.event.inputs.create_release == 'true')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Inspect Release Artifacts
        run: |
          echo "Artifacts to release:"
          ls -la release-dist/

      - name: Determine Tag & Release Name
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            NAME="Release $TAG"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAG="latest"
            NAME="EVA Mobile Latest Production Release"
          else
            TIMESTAMP="$(date +'%Y%m%d-%H%M')"
            TAG="release-$TIMESTAMP"
            NAME="EVA Mobile Build ($TIMESTAMP)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          draft: false
          prerelease: false
          make_latest: ${{ steps.release_meta.outputs.tag == 'latest' && 'true' || 'false' }}
          generate_release_notes: true
          files: |
            release-dist/*.apk
            release-dist/*.ipa
            release-dist/*.tar.gz
            release-dist/*.zip

      - name: Notify Discord on APK Release Success
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured. Skipping Discord notification."
            exit 0
          fi
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/latest"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          ACTOR="${{ github.actor }}"

          PAYLOAD=$(cat <<EOF
          {
            "embeds": [
              {
                "title": "📦 Rilis Sukses: Eva Mobile Android APK",
                "description": "Paket APK rilis produksi terbaru berhasil dikompilasi dan diterbitkan!\n\n📥 **Download APK**: [eva-mobile-release.apk](https://github.com/${{ github.repository }}/releases/latest/download/eva-mobile-release.apk)\n🏷️ **Release Tag**: [latest](${RELEASE_URL})",
                "url": "${RELEASE_URL}",
                "color": 3066993,
                "fields": [
                  {"name": "Branch", "value": "\`main\`", "inline": true},
                  {"name": "Commit", "value": "\`${SHORT_SHA}\`", "inline": true},
                  {"name": "Pemicu", "value": "@${ACTOR}", "inline": true}
                ],
                "footer": {"text": "EVA AI Mobile Release • GitHub Actions"},
                "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              }
            ],
            "allowed_mentions": {"parse": []}
          }
          EOF
          )

          curl -s -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
