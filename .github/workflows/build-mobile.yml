name: Build & Release Mobile & Web

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Target Application'
        required: true
        default: 'eva_counselor_mobile'
        type: choice
        options:
          - 'eva_counselor_mobile'
          - 'eva_mobile'
          - 'all'
      target:
        description: 'Target platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'android'
          - 'web'
          - 'ios'
      build_type:
        description: 'Build configuration'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'debug'
      create_release:
        description: 'Publish release assets to GitHub Releases'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'build-*'
      - 'v*'
      - 'release-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'android' || github.event.inputs.target == null }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Build APK - Eva Counselor Mobile (Psikolog)
        if: ${{ github.event.inputs.app == 'eva_counselor_mobile' || github.event.inputs.app == 'all' || github.event.inputs.app == null }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          echo "Building Eva Counselor Mobile Android APK (${BUILD_TYPE})..."
          cd apps/eva_counselor_mobile
          flutter pub get
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug
            cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/eva-counselor-mobile-debug.apk"
          else
            flutter build apk --release
            cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/eva-counselor-mobile-release.apk"
          fi

      - name: Build APK - Eva Mobile (Gen Z Curhat)
        if: ${{ github.event.inputs.app == 'eva_mobile' || github.event.inputs.app == 'all' || github.event.inputs.app == null }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          echo "Building Eva Mobile Android APK (${BUILD_TYPE})..."
          cd apps/eva_mobile
          flutter pub get
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug
            cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/eva-mobile-debug.apk"
          else
            flutter build apk --release
            cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/eva-mobile-release.apk"
          fi

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: "*.apk"
          if-no-files-found: error
          retention-days: 14

  build-web:
    name: Build Web Packages
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'web' || github.event.inputs.target == null }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Web - Eva Counselor Mobile
        if: ${{ github.event.inputs.app == 'eva_counselor_mobile' || github.event.inputs.app == 'all' || github.event.inputs.app == null }}
        run: |
          echo "Building Eva Counselor Web Release..."
          cd apps/eva_counselor_mobile
          flutter pub get
          flutter build web --release
          cd build
          tar -czf "$GITHUB_WORKSPACE/eva-counselor-web.tar.gz" web/
          zip -r -q "$GITHUB_WORKSPACE/eva-counselor-web.zip" web/

      - name: Build Web - Eva Mobile
        if: ${{ github.event.inputs.app == 'eva_mobile' || github.event.inputs.app == 'all' }}
        run: |
          echo "Building Eva Mobile Web Release..."
          cd apps/eva_mobile
          flutter pub get
          flutter build web --release
          cd build
          tar -czf "$GITHUB_WORKSPACE/eva-mobile-web.tar.gz" web/
          zip -r -q "$GITHUB_WORKSPACE/eva-mobile-web.zip" web/

      - name: Upload Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-packages
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iPhone iOS (.ipa Package)
    runs-on: macos-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'ios' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Xcode Environment
        run: flutter doctor -v

      - name: Build iPhone App & Package (.ipa) - Eva Counselor
        if: ${{ github.event.inputs.app == 'eva_counselor_mobile' || github.event.inputs.app == 'all' || github.event.inputs.app == null }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          cd apps/eva_counselor_mobile
          flutter pub get
          flutter build ios --no-codesign
          BUILD_DIR="build/ios/iphoneos"
          IPA_NAME="EvaCounselor-iPhone-${BUILD_TYPE}-unsigned.ipa"
          cd "$BUILD_DIR"
          mkdir -p Payload && cp -r Runner.app Payload/ && zip -r "${IPA_NAME}" Payload && rm -rf Payload
          cp "${IPA_NAME}" "$GITHUB_WORKSPACE/"

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: "*.ipa"
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-web]
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == true || github.event.inputs.create_release == 'true')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Inspect Release Artifacts
        run: |
          echo "Artifacts to release:"
          ls -la release-dist/

      - name: Determine Tag & Release Name
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            NAME="Release $TAG"
          else
            TIMESTAMP="$(date +'%Y%m%d-%H%M')"
            TAG="release-counselor-$TIMESTAMP"
            NAME="EVA Counselor Build ($TIMESTAMP)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-dist/*.apk
            release-dist/*.ipa
            release-dist/*.tar.gz
            release-dist/*.zip
